[package]
name = "meteo-widget-ffi"
description = "Functions the home-screen widgets call: JNI for Android, C for macOS (no UI code)."
edition.workspace = true
version.workspace = true
publish = false

[lib]
name = "meteo_widget"
# cdylib: libmeteo_widget.so for Android; staticlib: linked into the macOS widget.
crate-type = ["cdylib", "staticlib"]

[dependencies]
meteo-core = { path = "../core" }
jni = "0.21.1"
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }
