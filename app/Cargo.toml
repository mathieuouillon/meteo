[package]
name = "meteo"
edition.workspace = true
version.workspace = true

[dependencies]
meteo-core = { version = "0.1.0", path = "../core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-skia"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
# Same version as already used by the TLS stack; for LocationManager/Geocoder calls.
jni = "0.21.1"
# __system_property_get, for the preview overrides (animation.rs).
libc = "0.2"
# Android's sensor API (compass), the version android-activity already uses.
ndk-sys = "0.6.0"

[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
slint-build = "1.18.1"
