[package]
name = "meteo"
edition.workspace = true
version.workspace = true

[dependencies]
meteo-core = { version = "0.1.0", path = "../core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-skia"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }

[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
slint-build = "1.18.1"

[package.metadata.android]
package = "dev.meteo.app"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Météo"
