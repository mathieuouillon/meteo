[package]
name = "meteo"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
meteo-core = { version = "0.1.0", path = "../core" }
# Skia only; each platform adds its own backend below (the defaults would pull
# two more renderers and the desktop windowing into the Android library).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-skia"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros"] }
# Radar and map tiles; the version Slint's renderer already includes.
png = "0.18.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
# The desktop preview.
slint = { version = "1.18.1", default-features = false, features = ["backend-winit", "accessibility"] }

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
# The screenshot test draws the UI without a window or a GPU.
slint = { version = "1.18.1", default-features = false, features = ["renderer-software", "software-renderer-path", "software-renderer-systemfonts"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", default-features = false, features = ["backend-android-activity-06"] }
# Same version as already used by the TLS stack; for LocationManager/Geocoder calls.
jni = "0.21.1"
# __system_property_get, for the preview overrides (animation.rs).
libc = "0.2"
# Android's sensor API (compass), the version android-activity already uses.
ndk-sys = "0.6.0"

[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
slint-build = "1.18.1"
