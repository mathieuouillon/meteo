[workspace]
resolver = "3"
members = ["core", "app", "widget-ffi"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Slint's core with one change (vendor/i-slint-core/items/flickable.rs, search
# "Météo patch"): a one-axis Flickable only takes drags along its axis, so the
# day chart's hours can be swiped sideways inside the vertical page. Drop this
# when upgrading Slint if upstream does the same.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
